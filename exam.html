<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Online Exams - Vidyaalok Classes</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <style>
    :root {
      --navy: #0B2545;
      --gold: #E5A93C;
      --light-bg: #F1F5F9;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --success-green: #10B981;
      --error-red: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; overflow-x: hidden; }

    body {
      background-color: var(--light-bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 80px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      opacity: 0.10;
      z-index: 0;
      pointer-events: none;
    }

    header, main, footer { position: relative; z-index: 1; }

    header {
      background-color: #FFFFFF;
      padding: 0.6rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E2E8F0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: fixed;
      top: 0; left: 0; width: 100%;
      z-index: 1000;
    }

    .brand img { height: 48px; width: auto; display: block; }

    .timer-display {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--gold);
      background: var(--navy);
      padding: 6px 16px;
      border-radius: 8px;
    }

    .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; width: 100%; flex: 1; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 16px rgba(11, 37, 69, 0.04);
    }

    .btn {
      background-color: var(--navy);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn:disabled {
      background-color: #94A3B8 !important;
      cursor: not-allowed;
    }

    .btn-wa { background-color: #25D366 !important; }

    .q-box {
      border-bottom: 1px solid #E2E8F0;
      padding: 1rem 0;
      margin-bottom: 1rem;
    }

    .q-box h4 { margin-bottom: 0.6rem; color: var(--navy); }

    .opt-item {
      display: block;
      margin: 0.4rem 0;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .num-input {
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 1rem;
      width: 160px;
    }

    @media screen and (max-width: 768px) {
      body { padding-top: 110px; }
      header { flex-direction: column !important; padding: 0.5rem !important; gap: 0.5rem !important; }
      .brand img { height: 38px !important; }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="brand">
      <a href="dashboard.html"><img src="horizontal-logo.jpg" alt="Vidyaalok Classes"></a>
    </div>
    <div id="timer-box" style="display:none;" class="timer-display">
      ⏱️ <span id="time-left">00:00:00</span>
    </div>
  </header>

  <main class="container">
    
    <!-- Exam Selector List -->
    <div id="exam-portal" class="card">
      <h2 style="color: var(--navy); margin-bottom: 1rem;">📋 Active Assigned Examinations</h2>
      <div id="exam-list">Fetching active exams...</div>
    </div>

    <!-- Active Exam Interface Container -->
    <div id="active-test-container" class="card" style="display: none;">
      <h2 id="active-test-title" style="color: var(--navy); margin-bottom: 0.5rem;"></h2>
      <p id="active-test-info" style="color: var(--text-muted); margin-bottom: 1.2rem; font-size: 0.9rem;"></p>

      <!-- Subjective Mode (PDF Viewer) -->
      <div id="subjective-frame" style="display:none;">
        <iframe id="pdf-viewer" src="" width="100%" height="600px" style="border:1px solid #CBD5E1; border-radius:8px;"></iframe>
      </div>

      <!-- MCQ Mode (Dynamic Question Paper) -->
      <div id="mcq-frame" style="display:none;">
        <form id="mcq-form">
          <div id="mcq-questions-container"></div>
          <button type="submit" class="btn" style="margin-top: 1rem; width: 100%;">Submit Answer Paper</button>
        </form>
      </div>

      <!-- Time Over / Submission Complete Screen -->
      <div id="time-over-box" style="display:none; text-align:center; padding: 2rem 1rem;">
        <h3 id="end-status-heading" style="color: var(--error-red); margin-bottom: 0.5rem;">⚠️ Exam Time Over!</h3>
        <p id="end-status-desc" style="margin-bottom: 1.5rem; color: var(--text-dark);">
          The question paper is now closed. Please send your written answer sheet photos on WhatsApp for evaluation.
        </p>
        <a id="wa-submit-btn" href="#" target="_blank" class="btn btn-wa">📱 Send Answer Sheets on WhatsApp</a>
        <br><br>
        <a href="dashboard.html" class="btn">Return to Student Dashboard</a>
      </div>
    </div>

  </main>

  <script>
    const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8noXjpAwnp67h4tiaSkVKmx9usHvrQBM4pC7QlJI60AnRtsOUM12iW6_MkzuAQla3/exec";
    
    let activeExamObj = null;
    let timerInterval = null;

    document.addEventListener("DOMContentLoaded", async function() {
      const studentId = localStorage.getItem("studentId");
      if (!studentId) {
        window.location.href = "login.html";
        return;
      }

      // Check for an active unfinished exam in localStorage (Resumes if refreshed/disconnected)
      const savedTimerState = localStorage.getItem(`active_exam_timer_${studentId}`);
      
      try {
        const response = await fetch(`${GOOGLE_WEB_APP_URL}?action=getDashboard&roll=${encodeURIComponent(studentId)}`);
        const data = await response.json();

        if (data.status === "success" && data.student.exams) {
          renderExamList(data.student.exams);

          // Auto-resume test if browser reloaded or network reconnected
          if (savedTimerState) {
            const state = JSON.parse(savedTimerState);
            const matchExam = data.student.exams.find(e => e.examId === state.examId);
            if (matchExam && Date.now() < state.endTimestamp) {
              startExam(matchExam, state.endTimestamp);
            } else {
              localStorage.removeItem(`active_exam_timer_${studentId}`);
            }
          }
        } else {
          document.getElementById("exam-list").innerHTML = "<p style='text-align:center;'>No active exams assigned at this moment.</p>";
        }
      } catch (e) {
        document.getElementById("exam-list").innerHTML = "<p style='text-align:center;'>Error loading exams. Please try again.</p>";
      }
    });

    function renderExamList(exams) {
      const listDiv = document.getElementById("exam-list");
      if (!exams || exams.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center;'>No active exams assigned to your batch right now.</p>";
        return;
      }

      listDiv.innerHTML = "";
      exams.forEach(exam => {
        const attemptsText = exam.maxAttempts === -1 
          ? "Unlimited Attempts" 
          : `Attempts: ${exam.userAttempts} / ${exam.maxAttempts}`;

        const btnState = exam.canAttempt 
          ? `<button class="btn" onclick='startExam(${JSON.stringify(exam)})'>Start Test</button>` 
          : `<button class="btn" disabled>Max Attempts Reached</button>`;

        listDiv.innerHTML += `
          <div style="border-bottom: 1px solid #E2E8F0; padding: 14px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
              <strong style="font-size: 1.05rem; color: var(--navy);">${exam.title}</strong>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                Type: <strong>${exam.type}</strong> | Duration: ${exam.duration} Mins | ${attemptsText} | Expires: ${exam.expiry}
              </div>
            </div>
            <div>${btnState}</div>
          </div>
        `;
      });
    }

    function startExam(exam, existingEndTime = null) {
      activeExamObj = exam;
      const studentId = localStorage.getItem("studentId");

      document.getElementById("exam-portal").style.display = "none";
      document.getElementById("active-test-container").style.display = "block";
      document.getElementById("active-test-title").textContent = exam.title;
      document.getElementById("active-test-info").textContent = `Duration: ${exam.duration} Minutes | Type: ${exam.type}`;

      // Calculate Wall-Clock End Timestamp for Network & Reload Resistance
      let endTimestamp = existingEndTime;
      if (!endTimestamp) {
        const durationMs = parseInt(exam.duration) * 60 * 1000;
        endTimestamp = Date.now() + durationMs;
        localStorage.setItem(`active_exam_timer_${studentId}`, JSON.stringify({
          examId: exam.examId,
          endTimestamp: endTimestamp
        }));
      }

      document.getElementById("timer-box").style.display = "block";
      runTimer(endTimestamp);

      // Render Mode
      if (exam.type === "SUBJECTIVE") {
        document.getElementById("subjective-frame").style.display = "block";
        document.getElementById("pdf-viewer").src = exam.content;
      } else {
        // MCQ / Objective Mode
        document.getElementById("mcq-frame").style.display = "block";
        renderMCQQuestions(exam.content);
      }
    }

    function runTimer(endTimestamp) {
      clearInterval(timerInterval);
      
      timerInterval = setInterval(function() {
        const now = Date.now();
        const diffSeconds = Math.max(0, Math.floor((endTimestamp - now) / 1000));

        if (diffSeconds <= 0) {
          clearInterval(timerInterval);
          finishExam(true);
          return;
        }

        const hrs = String(Math.floor(diffSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(diffSeconds % 60).padStart(2, '0');

        document.getElementById("time-left").textContent = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function renderMCQQuestions(contentJsonStr) {
      const qContainer = document.getElementById("mcq-questions-container");
      qContainer.innerHTML = "";

      try {
        const questions = typeof contentJsonStr === "string" ? JSON.parse(contentJsonStr) : contentJsonStr;

        questions.forEach((q, idx) => {
          let html = `<div class="q-box"><h4>Q${idx + 1}. ${q.q}</h4>`;

          if (q.type === "SINGLE") {
            q.opts.forEach((opt, oIdx) => {
              html += `
                <label class="opt-item">
                  <input type="radio" name="q_${idx}" value="${oIdx}"> ${opt}
                </label>
              `;
            });
          } else if (q.type === "MULTI") {
            q.opts.forEach((opt, oIdx) => {
              html += `
                <label class="opt-item">
                  <input type="checkbox" name="q_${idx}" value="${oIdx}"> ${opt}
                </label>
              `;
            });
          } else if (q.type === "INTEGER") {
            html += `
              <input type="number" step="any" name="q_${idx}" class="num-input" placeholder="Enter Numerical Value">
            `;
          }

          html += `</div>`;
          qContainer.innerHTML += html;
        });
      } catch (e) {
        qContainer.innerHTML = "<p>Error loading exam questions. Contact teacher.</p>";
      }
    }

    // Submit Objective Answers
    document.getElementById("mcq-form").addEventListener("submit", function(e) {
      e.preventDefault();
      finishExam(false);
    });

    function finishExam(isTimeout) {
      clearInterval(timerInterval);
      const studentId = localStorage.getItem("studentId");
      localStorage.removeItem(`active_exam_timer_${studentId}`);

      document.getElementById("subjective-frame").style.display = "none";
      document.getElementById("mcq-frame").style.display = "none";
      document.getElementById("timer-box").style.display = "none";
      document.getElementById("time-over-box").style.display = "block";

      if (activeExamObj.type === "SUBJECTIVE") {
        document.getElementById("end-status-heading").textContent = isTimeout ? "⚠️ Exam Time Over!" : "✅ Paper Completed";
        document.getElementById("end-status-desc").textContent = "The question paper is now locked. Please send your written answer sheet photos on WhatsApp for evaluation.";
        
        const waMsg = encodeURIComponent(`Hello Sir, I have completed the Subjective Exam (${activeExamObj.title}) for Roll No: ${studentId}. Attached are my answer photos.`);
        document.getElementById("wa-submit-btn").href = `https://wa.me/918240949137?text=${waMsg}`;
        document.getElementById("wa-submit-btn").style.display = "inline-block";
      } else {
        document.getElementById("end-status-heading").textContent = "✅ Exam Submitted Successfully!";
        document.getElementById("end-status-desc").textContent = "Your objective answers have been recorded. Marks will reflect on your dashboard shortly.";
        document.getElementById("wa-submit-btn").style.display = "none";
      }
    }
  </script>
</body>
</html>
