<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Online Examination Portal | Vidyaalok Classes</title>
 <link rel="icon" type="image/jpeg" href="icon.jpg">
 <style>
 :root {
 --navy: #0B2545;
 --gold: #E5A93C;
 --light-bg: #F1F5F9;
 --card-bg: rgba(255, 255, 255, 0.95);
 --text-dark: #1E293B;
 --text-muted: #64748B;
 }

 * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
 html, body { width: 100%; overflow-x: hidden; }

 body {
 background-color: var(--light-bg);
 background-image: url('logo.png');
 background-repeat: no-repeat;
 background-position: center 250px;
 background-attachment: fixed;
 background-size: 550px;
 color: var(--text-dark);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 }

 header {
 background-color: #FFFFFF;
 padding: 0.8rem 2rem;
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-bottom: 1px solid #E2E8F0;
 box-shadow: 0 2px 6px rgba(0,0,0,0.05);
 position: sticky;
 top: 0;
 z-index: 100;
 }

 .brand img { height: 52px; width: auto; display: block; }
 nav { display: flex; gap: 1.2rem; align-items: center; }
 nav a { color: var(--navy); text-decoration: none; font-size: 0.95rem; font-weight: 600; padding: 6px 12px; border-radius: 6px; }
 .btn-portal { background-color: var(--navy); color: #FFFFFF !important; border-radius: 6px; padding: 8px 16px !important; }

 .portal-container { max-width: 650px; margin: 3rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
 .card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 16px rgba(11, 37, 69, 0.08); border: 1px solid rgba(226, 232, 240, 0.9); margin-bottom: 2rem; }
 .form-group { margin-bottom: 1.2rem; }
 .form-group label { display: block; font-weight: 700; margin-bottom: 0.4rem; color: var(--navy); font-size: 0.9rem; }
 .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 0.95rem; }
 .btn-action { width: 100%; background-color: var(--navy); color: #FFFFFF; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; text-align: center; }

 .test-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-left: 4px solid var(--gold); border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
 .test-info h3 { color: var(--navy); font-size: 1.1rem; margin-bottom: 4px; }
 .test-meta { font-size: 0.85rem; color: var(--text-muted); }
 .btn-proceed { background-color: #16A34A; color: #FFFFFF; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }

 /* Exam Engine Overlay */
 #examInterface { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #FFFFFF; z-index: 1000; flex-direction: column; }
 .exam-header { background-color: var(--navy); color: #FFFFFF; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
 .timer-box { background: rgba(255, 255, 255, 0.1); padding: 6px 16px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 1.1rem; font-weight: 700; }
 .split-container { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }
 .pdf-viewer { width: 60%; height: 100%; background-color: #525659; border-right: 2px solid #CBD5E1; }
 .pdf-viewer iframe { width: 100%; height: 100%; border: none; }
 .answer-palette { width: 40%; height: 100%; background-color: #FFFFFF; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
 .q-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; margin-bottom: 0.6rem; }
 .q-num { font-weight: 700; color: var(--navy); width: 35px; }
 .options-group { display: flex; gap: 0.8rem; }
 .btn-submit-exam { background-color: #DC2626; color: #FFFFFF; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 1rem; }

 footer { background-color: var(--navy); color: #94A3B8; padding: 2rem 1rem; border-top: 3px solid var(--gold); text-align: center; font-size: 0.85rem; margin-top: auto; }

 @media screen and (max-width: 768px) {
 header { flex-direction: column !important; padding: 0.8rem 1rem !important; gap: 0.8rem !important; align-items: center !important; }
 .brand img { height: 42px !important; width: auto !important; }
 nav { flex-wrap: wrap !important; justify-content: center !important; gap: 0.4rem 0.6rem !important; width: 100% !important; }
 nav a { font-size: 0.82rem !important; padding: 5px 8px !important; white-space: nowrap !important; }
 .btn-portal { padding: 6px 12px !important; font-size: 0.85rem !important; }
 .portal-container { width: 100% !important; max-width: 100% !important; padding: 0 1rem !important; margin: 1.5rem auto !important; }
 .card { padding: 1.2rem !important; width: 100% !important; }
 .test-card { flex-direction: column !important; align-items: flex-start !important; }
 .btn-proceed { width: 100% !important; text-align: center !important; }
 
 /* Split-screen stacked on mobile */
 .split-container { flex-direction: column !important; overflow-y: auto !important; }
 .pdf-viewer { width: 100% !important; height: 50vh !important; }
 .answer-palette { width: 100% !important; height: auto !important; }
 }
 </style>
</head>
<body>
 <header id="mainHeader">
 <div class="brand"><a href="index.html"><img src="horizontal-logo.jpg" alt="Vidyaalok Classes"></a></div>
 <nav>
 <a href="index.html">Home</a>
 <a href="schedule.html">Schedule</a>
 <a href="notes.html">Class Notes</a>
 <a href="exam.html" class="active">Online Exams</a>
 <a href="login.html" class="btn-portal">Student Portal</a>
 </nav>
 </header>

 <div class="portal-container" id="portalContainer">
 <!-- STEP 1: EXAM LOGIN -->
 <div class="card" id="examLoginCard">
 <h2 style="color: var(--navy); text-align: center; margin-bottom: 1.5rem;">Online Exam Portal Login</h2>
 <div id="errorMsg" style="font-size: 0.88rem; margin-bottom: 1rem; text-align: center;"></div>
 <div class="form-group"><label>Student ID</label><input type="text" id="studentId" placeholder="e.g., VAK26001"></div>
 <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter Password"></div>
 <button class="btn-action" onclick="loginExam()">Login to View Tests</button>
 </div>

 <!-- STEP 2: SELECT TEST -->
 <div class="card" id="testSelectionCard" style="display: none;">
 <h2 style="color: var(--navy); border-bottom: 2px solid #E2E8F0; padding-bottom: 0.5rem; margin-bottom: 0.5rem;" id="welcomeStudent">Available Examinations</h2>
 <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;" id="studentBatchMeta">Loading tests...</p>
 <div id="testsList"></div>
 <button class="btn-action" onclick="logoutExam()" style="margin-top: 1.5rem; background-color: #64748B;">Logout</button>
 </div>
 </div>

 <!-- STEP 3: EXAM INTERFACE -->
 <div id="examInterface">
 <div class="exam-header">
 <div class="exam-title"><h2 id="activeTestTitle">Examination</h2><p id="activeStudentMeta">Student: Loading...</p></div>
 <div class="timer-box">Time: <span id="timer">00:00</span></div>
 </div>
 <div class="split-container">
 <div class="pdf-viewer"><iframe id="pdfFrame" src=""></iframe></div>
 <div class="answer-palette">
 <div id="questionsContainer"></div>
 <button class="btn-submit-exam" onclick="submitExam()">Submit Examination</button>
 </div>
 </div>
 </div>

 <footer id="mainFooter">
 <p><strong>Vidyaalok Classes</strong> — The Light of Knowledge</p>
 <p style="margin-top: 4px; color: #64748B;">Kharagpur, West Bengal, India, Pin-721301</p>
 </footer>

 <script>
 const SCRIPT_URL = "YOUR_WEB_APP_URL_HERE";

 let currentStudentId = "";
 let loggedStudentName = "";
 let loggedStudentBatch = "";
 let activeTestObj = null;
 let timerInterval;

 function loginExam() {
 const studentId = document.getElementById('studentId').value.trim();
 const password = document.getElementById('password').value.trim();
 const errorMsg = document.getElementById('errorMsg');

 if (!studentId || !password) {
 errorMsg.style.color = "#DC2626";
 errorMsg.textContent = "Please enter both Student ID and Password.";
 return;
 }
 errorMsg.style.color = "#0284C7";
 errorMsg.textContent = "Verifying credentials...";

 fetch(`${SCRIPT_URL}?action=login&studentId=${encodeURIComponent(studentId)}&password=${encodeURIComponent(password)}`)
 .then(res => res.json())
 .then(data => {
 if (data.success) {
 currentStudentId = studentId;
 loggedStudentName = data.studentName;
 loggedStudentBatch = data.batch;
 
 document.getElementById('examLoginCard').style.display = 'none';
 document.getElementById('testSelectionCard').style.display = 'block';
 document.getElementById('welcomeStudent').textContent = `Welcome, ${data.studentName}`;
 document.getElementById('studentBatchMeta').textContent = `Assigned Batch: ${data.batch}`;
 
 fetchTestsForBatch(data.batch);
 } else {
 errorMsg.style.color = "#DC2626";
 errorMsg.textContent = data.message;
 }
 });
 }

 function fetchTestsForBatch(batch) {
 const testsList = document.getElementById('testsList');
 testsList.innerHTML = "<p>Loading batch tests...</p>";

 fetch(`${SCRIPT_URL}?action=getTests&batch=${encodeURIComponent(batch)}`)
 .then(res => res.json())
 .then(data => {
 if (data.success && data.tests.length > 0) {
 testsList.innerHTML = "";
 data.tests.forEach(test => {
 const tCard = document.createElement('div');
 tCard.className = 'test-card';
 tCard.innerHTML = `
 <div class="test-info">
 <h3>${test.title} (${test.subject})</h3>
 <div class="test-meta">Duration: ${test.timeMins} Mins • Total Questions: ${test.totalQuestions}</div>
 </div>
 <button class="btn-proceed" onclick='startTest(${JSON.stringify(test)})'>Proceed & Start</button>
 `;
 testsList.appendChild(tCard);
 });
 } else {
 testsList.innerHTML = "<p style='color: var(--text-muted);'>No active test papers published for your batch yet.</p>";
 }
 });
 }

 function startTest(test) {
 activeTestObj = test;
 document.getElementById('portalContainer').style.display = 'none';
 document.getElementById('mainHeader').style.display = 'none';
 document.getElementById('mainFooter').style.display = 'none';
 document.getElementById('examInterface').style.display = 'flex';

 document.getElementById('activeTestTitle').textContent = test.title;
 document.getElementById('activeStudentMeta').textContent = `Student: ${loggedStudentName} (${loggedStudentBatch})`;
 document.getElementById('pdfFrame').src = test.pdfUrl + "#toolbar=0";

 const qContainer = document.getElementById('questionsContainer');
 qContainer.innerHTML = `<h3 style="color: var(--navy); margin-bottom: 1rem;">Response Sheet (${test.totalQuestions} Questions)</h3>`;

 const qTypes = test.qTypes || [];

 for (let q = 1; q <= test.totalQuestions; q++) {
 const type = qTypes[q - 1] || "MCQ";
 const qRow = document.createElement('div');
 qRow.className = 'q-row';

 let inputHtml = "";
 if (type === "MCQ") {
 inputHtml = `<div class="options-group">
 <label><input type="radio" name="q${q}" value="A"> A</label>
 <label><input type="radio" name="q${q}" value="B"> B</label>
 <label><input type="radio" name="q${q}" value="C"> C</label>
 <label><input type="radio" name="q${q}" value="D"> D</label>
 </div>`;
 } else if (type === "MULTI") {
 inputHtml = `<div class="options-group">
 <label><input type="checkbox" name="q${q}" value="A"> A</label>
 <label><input type="checkbox" name="q${q}" value="B"> B</label>
 <label><input type="checkbox" name="q${q}" value="C"> C</label>
 <label><input type="checkbox" name="q${q}" value="D"> D</label>
 </div>`;
 } else if (type === "NUM") {
 inputHtml = `<input type="number" step="any" id="q${q}_num" placeholder="Answer" style="width: 100px; padding: 4px; border: 1px solid #CBD5E1; border-radius: 4px;">`;
 }

 qRow.innerHTML = `<span class="q-num">Q${q}</span>${inputHtml}`;
 qContainer.appendChild(qRow);
 }

 let timeRemaining = parseInt(test.timeMins) * 60;
 clearInterval(timerInterval);
 timerInterval = setInterval(() => {
 let mins = Math.floor(timeRemaining / 60);
 let secs = timeRemaining % 60;
 document.getElementById('timer').textContent = `${mins < 10 ? "0"+mins : mins}:${secs < 10 ? "0"+secs : secs}`;
 if (--timeRemaining < 0) {
 clearInterval(timerInterval);
 alert("Time Up! Submitting test.");
 submitExam();
 }
 }, 1000);
 }

 function submitExam() {
 if (!confirm("Are you sure you want to submit your test?")) return;
 clearInterval(timerInterval);

 const answers = [];
 const qTypes = activeTestObj.qTypes || [];

 for (let q = 1; q <= activeTestObj.totalQuestions; q++) {
 const type = qTypes[q - 1] || "MCQ";
 if (type === "MCQ") {
 const sel = document.querySelector(`input[name="q${q}"]:checked`);
 answers.push(sel ? sel.value : "UNANSWERED");
 } else if (type === "MULTI") {
 const checked = Array.from(document.querySelectorAll(`input[name="q${q}"]:checked`)).map(cb => cb.value);
 answers.push(checked.length > 0 ? checked : "UNANSWERED");
 } else if (type === "NUM") {
 const val = document.getElementById(`q${q}_num`).value.trim();
 answers.push(val !== "" ? val : "UNANSWERED");
 }
 }

 fetch(SCRIPT_URL, {
 method: "POST",
 body: JSON.stringify({
 action: "submitTest",
 studentId: currentStudentId,
 testId: activeTestObj.testId,
 answers: answers
 })
 })
 .then(res => res.json())
 .then(data => {
 if (data.success) {
 alert(`Test Submitted!\nScore: ${data.score} / ${data.totalMarks}\nPercentage: ${data.percentage}%`);
 location.reload();
 }
 });
 }

 function logoutExam() { location.reload(); }
 </script>
</body>
</html>
