<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Portal - Vidyaalok Classes</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <style>
    :root {
      --navy: #0B2545;
      --gold: #E5A93C;
      --light-bg: #F1F5F9;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --error-red: #EF4444;
      --success-green: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    /* Body Background with Fixed Logo Watermark */
    body {
      background-color: var(--light-bg);
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center 250px;
      background-attachment: fixed;
      background-size: 500px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 75px; /* Ensures content isn't hidden under header */
    }

    /* Fixed Header Navigation */
    header {
      background-color: #FFFFFF;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E2E8F0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .brand img {
      height: 52px;
      width: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 1.2rem;
      align-items: center;
    }

    nav a {
      color: var(--navy);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--gold);
      background-color: #F1F5F9;
    }

    .btn-portal {
      background-color: var(--navy);
      color: #FFFFFF !important;
      border-radius: 6px;
      padding: 8px 16px !important;
    }

    .btn-portal:hover {
      background-color: #133966;
      color: var(--gold) !important;
    }

    /* Main Login Container */
    .container {
      max-width: 440px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 2.2rem 2rem;
      box-shadow: 0 8px 24px rgba(11, 37, 69, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.9);
      text-align: center;
    }

    .login-card h1 {
      color: var(--navy);
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.8rem;
    }

    /* Form Fields */
    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(11, 37, 69, 0.1);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--navy);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #133966;
    }

    /* Alert Message Box */
    .status-message {
      display: none;
      margin-top: 1.5rem;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .status-message.error {
      background-color: #FEE2E2;
      color: var(--error-red);
      border: 1px solid #FCA5A5;
    }

    .status-message.success {
      background-color: #D1FAE5;
      color: var(--success-green);
      border: 1px solid #6EE7B7;
    }

    /* Footer */
    footer {
      background-color: var(--navy);
      color: #94A3B8;
      padding: 2.5rem 1rem;
      border-top: 3px solid var(--gold);
      margin-top: auto;
    }

    .footer-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      text-align: left;
    }

    .footer-copyright {
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 2rem;
      padding-top: 1rem;
      font-size: 0.8rem;
      color: #64748B;
    }

    /* Mobile Responsive Rules */
    @media screen and (max-width: 768px) {
      body {
        padding-top: 110px;
        background-size: 350px; /* Scaled down watermark on mobile */
      }

      header {
        flex-direction: column !important;
        padding: 0.8rem 1rem !important;
        gap: 0.8rem !important;
      }

      nav {
        flex-wrap: wrap !important;
        justify-content: center !important;
        gap: 0.4rem 0.6rem !important;
        width: 100% !important;
      }

      nav a {
        font-size: 0.82rem !important;
        padding: 5px 8px !important;
      }

      .footer-container {
        flex-direction: column !important;
        text-align: center !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Header Navigation -->
  <header>
    <div class="brand">
      <a href="index.html"><img src="horizontal-logo.jpg" alt="Vidyaalok Classes - The Light of Knowledge"></a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="notes.html">Class Notes</a>
      <a href="exam.html">Online Exams</a>
      <a href="index.html#about">About</a>
      <a href="index.html#courses">Courses</a>
      <a href="index.html#contact">Contact</a>
      <a href="login.html" class="btn-portal active">Student Portal</a>
    </nav>
  </header>

  <!-- Portal Login Box -->
  <main class="container">
    <div class="login-card">
      <h1>Student Portal Login</h1>
      <p>Enter your credentials to access your dashboard.</p>

      <form id="student-login-form">
        <div class="form-group">
          <label for="student-id">Student ID / Roll No.</label>
          <input type="text" id="student-id" placeholder="e.g. VAK26001" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn-submit">Login to Dashboard</button>
      </form>

      <div id="status-message" class="status-message"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div>
        <h3 style="color: #FFFFFF; font-size: 1.2rem; margin-bottom: 4px;">Vidyaalok Classes</h3>
        <p style="color: var(--gold); font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">The Light of Knowledge</p>
      </div>
      <div style="font-size: 0.9rem; color: #E2E8F0;">
        📍 Kharagpur, West Bengal | 📞 +91 8240949137
      </div>
    </div>
    <div class="footer-copyright">
      © 2026 Vidyaalok Classes. All rights reserved.
    </div>
  </footer>

  <!-- JavaScript Form Submission Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('student-login-form');
      const statusMsg = document.getElementById('status-message');

      loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); // Prevents page reload

        const studentId = document.getElementById('student-id').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!studentId || !password) {
          showStatus("Please fill in both Student ID and Password.", "error");
          return;
        }

        // Process authentication on explicit submit click
        authenticateStudent(studentId, password);
      });

      function authenticateStudent(id, pass) {
        // Add your authentication check or backend redirect logic here
        if (id && pass) {
          showStatus("Login successful! Redirecting to dashboard...", "success");
        } else {
          showStatus("Invalid Student ID or Password.", "error");
        }
      }

      function showStatus(text, type) {
        statusMsg.textContent = text;
        statusMsg.className = "status-message " + type;
        statusMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
