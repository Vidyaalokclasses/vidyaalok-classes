<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent & Student Portal | Vidyaalok Classes</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        :root { --navy: #0B2545; --gold: #E5A93C; --card-bg: rgba(255, 255, 255, 0.95); --text-dark: #1E293B; --text-muted: #64748B; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #F1F5F9; background-image: url('logo.png'); background-repeat: no-repeat; background-position: center 250px; background-attachment: fixed; background-size: 550px; color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #FFFFFF; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8F0; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); position: sticky; top: 0; z-index: 100; }
        .brand img { height: 52px; width: auto; display: block; }
        nav { display: flex; gap: 1.2rem; align-items: center; }
        nav a { color: var(--navy); text-decoration: none; font-size: 0.95rem; font-weight: 600; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }
        nav a:hover, nav a.active { color: var(--gold); background-color: #F1F5F9; }
        .btn-portal { background-color: var(--navy); color: #FFFFFF !important; border-radius: 6px; padding: 8px 16px !important; }
        .btn-portal:hover { background-color: #133966; color: var(--gold) !important; }
        .container { max-width: 500px; margin: 3rem auto; padding: 0 1.5rem; flex: 1; }
        .card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 16px rgba(11, 37, 69, 0.08); border: 1px solid rgba(226, 232, 240, 0.9); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 0.4rem; color: var(--navy); font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 0.95rem; }
        .btn-login { width: 100%; background-color: var(--navy); color: #FFFFFF; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background-color: #133966; color: var(--gold); }
        footer { background-color: var(--navy); color: #94A3B8; padding: 2rem 1rem; border-top: 3px solid var(--gold); text-align: center; font-size: 0.85rem; margin-top: auto; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <a href="index.html"><img src="horizontal-logo.jpg" alt="Vidyaalok Classes"></a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="notes.html">Class Notes</a>
            <a href="exam.html">Online Exams</a>
            <a href="login.html" class="btn-portal">Student Portal</a>
        </nav>
    </header>

    <div class="container">
        <div class="card" id="loginCard">
            <h2 style="color: var(--navy); text-align: center; margin-bottom: 1.5rem;">Parent & Student Login</h2>
            <div id="errorMsg" style="font-size: 0.88rem; margin-bottom: 1rem; text-align: center;"></div>
            
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="studentId" placeholder="Enter Student ID (e.g., VAK26001)">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password">
            </div>
            <button class="btn-login" onclick="login()">Login to Dashboard</button>
        </div>
    </div>

    <footer>
        <p><strong>Vidyaalok Classes</strong> — The Light of Knowledge</p>
        <p style="margin-top: 4px; color: #64748B;">Kharagpur, West Bengal, India, Pin-721301</p>
    </footer>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8noXjpAwnp67h4tiaSkVKmx9usHvrQBM4pC7QlJI60AnRtsOUM12iW6_MkzuAQla3/exec";

        function login() {
            const studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.querySelector('.btn-login');

            if (!studentId || !password) {
                errorMsg.style.color = "#DC2626";
                errorMsg.textContent = "Please enter both Student ID and Password.";
                return;
            }

            errorMsg.style.color = "#0284C7";
            errorMsg.textContent = "Authenticating & loading portal data... Please wait.";
            loginBtn.textContent = "Loading...";
            loginBtn.disabled = true;
            loginBtn.style.opacity = "0.7";

            const requestUrl = `${SCRIPT_URL}?studentId=${encodeURIComponent(studentId)}&password=${encodeURIComponent(password)}`;

            fetch(requestUrl, { method: "GET", redirect: "follow" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Use sessionStorage so it erases when the tab is closed
                        sessionStorage.setItem("studentId", studentId);
                        sessionStorage.setItem("dashboardData", JSON.stringify(data.student));
                        
                        fetch(SCRIPT_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain" },
                            body: JSON.stringify({ action: "logActivity", roll: studentId, actionDetail: "Logged into Portal" })
                        })
                        .then(() => {
                            window.location.href = "dashboard.html";
                        })
                        .catch(e => {
                            console.log("Log ping failed", e);
                            window.location.href = "dashboard.html"; 
                        });

                    } else {
                        errorMsg.style.color = "#DC2626";
                        errorMsg.textContent = data.message || "Invalid Student ID or Password.";
                        loginBtn.textContent = "Login to Dashboard";
                        loginBtn.disabled = false;
                        loginBtn.style.opacity = "1";
                    }
                })
                .catch(error => {
                    console.error("Fetch Error:", error);
                    errorMsg.style.color = "#DC2626";
                    errorMsg.textContent = "Error connecting to server. Please check deployment settings.";
                    loginBtn.textContent = "Login to Dashboard";
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = "1";
                });
        }
    </script>
</body>
</html>
